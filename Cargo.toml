[package]
name = "game-cheetah"
version = "0.7.0"
authors = ["Mike Krüger <mkrueger@posteo.de>"]
edition = "2024"
rust-version = "1.88"
description = "High-performance memory scanner/editor and game trainer for Linux, Windows, and macOS"
license = "Apache-2.0"
repository = "https://github.com/mkrueger/game_cheetah"
# Not published on crates.io: depends on icy_ui's git fork. Distribute via GitHub releases.
publish = false

[package.metadata.bundle]
name = "GameCheetah"
identifier = "com.github.game_cheetah"
icon = ["build/mac/128x128@2x.png"]
resources = []
copyright = "Copyright (c) Mike Krüger 2022. All rights reserved."
short_description = "An in memory trainer for games."
long_description = """
Allows to alter values in computer games or freeze them to certain values.
"""

[dependencies]
eframe = { version = "0.34.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.34.2"
egui_extras = { version = "0.34.2", features = ["all_loaders"] }
process-memory = "0.5.0"
sysinfo = "0.38.4"
gabi = "0.2.6"
i18n-embed = { version = "0.16.0", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10.0"
once_cell = "1.21.3"
rust-embed = "8.9.0"
proc-maps = "0.4.0"
webbrowser = "1.0.5"
rayon = "1.11.0"
memchr = "2.7.6"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
wide = "1.4.0"
bytemuck = "1"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.2"
dirs = "6.0"
opener = "0.8"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
smol = "2"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
    "html_reports",
] }

[[bench]]
name = "search_scan"
harness = false

[[bench]]
name = "search_regions"
harness = false

# Linux: libc for process_vm_readv
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
winres = "0.1"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
incremental = false
rpath = false
overflow-checks = false  # Disable overflow checks in release
debug = false            # Ensure no debug info
debug-assertions = false # Disable debug assertions

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
strip = "symbols"

[profile.release.package.eframe]
opt-level = 3

[profile.release.package.egui]
opt-level = 3

[profile.release.package.rayon]
opt-level = 3

[patch.crates-io]

[package.metadata.deb]
section = "Utility"
copyright = "Copyright (c) Mike Krüger 2022-25. All rights reserved."
license-file = "build/license.rtf"
assets = [
    [
        "target/release/game-cheetah",
        "/usr/bin/",
        "755",
    ],
    [
        "build/linux/game-cheetah.desktop",
        "/usr/share/applications/",
        "644",
    ],
    [
        "build/linux/128x128.png",
        "/usr/share/icons/hicolor/128x128/apps/game-cheetah.png",
        "644",
    ],
    [
        "build/linux/256x256.png",
        "/usr/share/icons/hicolor/256x256/apps/game-cheetah.png",
        "644",
    ],
]
