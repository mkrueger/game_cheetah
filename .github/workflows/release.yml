name: Release

# Everything a tag hands out: the Linux deb and AppImage, the Windows exe and
# the universal macOS dmg. Each file is attached to the tag's release, which is
# opened as a draft so the notes can be reviewed before publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag whose release the files are attached to
        required: true

permissions:
  contents: write

env:
  APP_NAME: game-cheetah
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  open_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Open the release unless it is already there
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG already has a release, attaching to it"
          else
            gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --generate-notes
            echo "opened a draft release for $TAG - review it and press publish"
          fi

  linux:
    needs: open_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install gtk
        run: |
          sudo apt-get update
          sudo apt-get install build-essential libgtk-3-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Install cargo deb
        run: cargo install cargo-deb --version 2.7.0
      - name: Prepare package metadata
        id: package-metadata
        run: |
          export VERSION=$(python3 tools/prep_diz.py "file_id.diz")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build deb
        run: |
          DEB=$(cargo deb)
          echo "Copy $DEB to ${{ env.APP_NAME }}_${VERSION}_amd64.deb"
          mv "$DEB" "${{ env.APP_NAME }}_${VERSION}_amd64.deb"
      - name: Build AppImage
        id: build-appimage
        run: |
          cargo build --release --locked
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p ${{ env.APP_NAME }}-appimage/usr/bin
          cp build/linux/256x256.png ${{ env.APP_NAME }}-appimage/${{ env.APP_NAME }}.png
          cp build/linux/${{ env.APP_NAME }}.desktop ${{ env.APP_NAME }}-appimage/
          cp target/release/${{ env.APP_NAME }} ${{ env.APP_NAME }}-appimage/usr/bin/
          echo "#!/bin/bash" > ${{ env.APP_NAME }}-appimage/AppRun
          echo "exec \"\$(dirname \"\$0\")/usr/bin/${{ env.APP_NAME }}\" \"\$@\"" >> ${{ env.APP_NAME }}-appimage/AppRun
          chmod a+x ${{ env.APP_NAME }}-appimage/AppRun

          export app_img=$(python3 tools/get_app_img.py "${{ env.APP_NAME }}" "${{ steps.package-metadata.outputs.version }}" x86_64)
          echo "app_img=$app_img" >> $GITHUB_OUTPUT

          ./appimagetool-x86_64.AppImage "${{ env.APP_NAME }}-appimage" "$app_img"
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" \
            "${{ env.APP_NAME }}_${VERSION}_amd64.deb" \
            "${{ steps.build-appimage.outputs.app_img }}" \
            --repo "$REPO" --clobber

  windows:
    needs: open_release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build exe
        run: cargo build --release --locked
      - name: Prepare package metadata
        id: package-metadata
        shell: pwsh
        run: |
          $VERSION=$(python tools/prep_diz.py file_id.diz)
          echo "Version: $VERSION"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$VERSION"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$VERSION"
      - name: Pack it
        shell: pwsh
        run: |
          cp target/release/${{ env.APP_NAME }}.exe "./${{ env.APP_NAME }}.exe"
          Compress-Archive -Path "${{ env.APP_NAME }}.exe", file_id.diz, LICENSE `
            -DestinationPath "${{ env.APP_NAME }}_${env:VERSION}_windows_x64.zip"
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "${{ env.APP_NAME }}_${VERSION}_windows_x64.zip" --repo "$REPO" --clobber

  macos:
    needs: open_release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Prepare package metadata
        id: package-metadata
        run: |
          export VERSION=$(python3 tools/prep_diz.py "file_id.diz")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build app
        id: build-app
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

          export app=$(python3 tools/get_name.py "${{ env.APP_NAME }}")
          echo "Build bundle for: $app"
          echo "app=$app" >> $GITHUB_OUTPUT

          echo "Creating dir '$app.app/Contents/MacOS'"
          mkdir -p "$app.app/Contents/MacOS"
          echo "Creating dir '$app.app/Contents/Resources'"
          mkdir -p "$app.app/Contents/Resources"

          cp build/mac/Info.plist "${app}.app/Contents/Info.plist"

          bundle_plist="${app}.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ${{ env.APP_NAME }}" "$bundle_plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$bundle_plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$bundle_plist" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$bundle_plist"

          mkdir -p AppIcon.iconset
          sips -z 16 16 build/mac/128x128@2x.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32 build/mac/128x128@2x.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32 build/mac/128x128@2x.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64 build/mac/128x128@2x.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128 build/mac/128x128@2x.png --out AppIcon.iconset/icon_128x128.png
          cp build/mac/128x128@2x.png AppIcon.iconset/icon_128x128@2x.png
          iconutil -c icns AppIcon.iconset
          cp AppIcon.icns "$app.app/Contents/Resources"

          echo "Version: $VERSION"

          echo "Creating universal binary $app.app/Contents/MacOS/${{ env.APP_NAME }}"
          lipo "target/x86_64-apple-darwin/release/${{ env.APP_NAME }}" \
               "target/aarch64-apple-darwin/release/${{ env.APP_NAME }}" \
               -create -output "$app.app/Contents/MacOS/${{ env.APP_NAME }}"

          plist_executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle_plist")
          test -x "$app.app/Contents/MacOS/$plist_executable"
          file "$app.app/Contents/MacOS/${{ env.APP_NAME }}"

          # lipo creates a fresh universal Mach-O, so sign the final bundle.
          # This is an ad-hoc signature (no Apple Developer ID secret needed),
          # but it avoids shipping an unsigned/incomplete app bundle.
          codesign --force --deep --sign - "$app.app"
          codesign --verify --deep --strict --verbose=2 "$app.app"
      - name: Build dmg
        id: build-dmg
        run: |
          create-dmg \
            --volname "${{ steps.build-app.outputs.app }} Installer" \
            --volicon "AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 128 \
            --hide-extension "${{ steps.build-app.outputs.app }}.app" \
            --app-drop-link 600 185 \
            "${{ env.APP_NAME }}-${{ steps.package-metadata.outputs.version }}-universal.dmg" \
            "${{ steps.build-app.outputs.app }}.app"
          echo "dmg_file=${{ env.APP_NAME }}-${{ steps.package-metadata.outputs.version }}-universal.dmg" >> $GITHUB_OUTPUT
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "${{ steps.build-dmg.outputs.dmg_file }}" --repo "$REPO" --clobber
